[package]
name = "vellum"
version = "0.2.0"
description = "Local-first literature translation reader"
authors = ["You"]
edition = "2021"

[lib]
name = "vellum_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
